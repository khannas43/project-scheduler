# Project key — create this exact key in SonarQube (see docs/SONAR.md).
sonar.projectKey=project-scheduler
sonar.projectName=Project Scheduler
sonar.projectVersion=0.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=apps,packages
sonar.tests=apps,packages

# Analyze TypeScript / JS sources; keep generated and vendor noise out.
sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/.turbo/**,\
**/coverage/**,\
**/build/**,\
**/project-scheduler-worktrees/**,\
**/.scannerwork/**,\
apps/api/src/db/migrations/**,\
**/*.config.*,\
**/vite.config.*,\
**/vitest.config.*

sonar.test.inclusions=\
**/*.test.ts,\
**/*.test.tsx,\
**/test/**/*.ts,\
**/test/**/*.tsx

sonar.coverage.exclusions=\
**/*.test.ts,\
**/*.test.tsx,\
**/test/**,\
**/src/test/**,\
apps/api/src/db/migrations/**,\
apps/api/src/db/seed.ts,\
**/*.config.*,\
**/vite.config.*,\
**/vitest.config.*

# Vitest LCOV (generated by `pnpm test:coverage`)
sonar.javascript.lcov.reportPaths=\
apps/api/coverage/lcov.info,\
apps/web/coverage/lcov.info,\
packages/scheduler/coverage/lcov.info,\
packages/schema/coverage/lcov.info,\
packages/gantt/coverage/lcov.info

# Pin a single Sonar-only tsconfig (avoids walking pnpm + Finder duplicate "* 2" links).
sonar.typescript.tsconfigPaths=tsconfig.sonar.json

# Pull request decoration (CI sets these; local scans omit them)
# sonar.pullrequest.key=
# sonar.pullrequest.branch=
# sonar.pullrequest.base=
