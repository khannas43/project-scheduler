server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the api service, matching apps/web/vite.config.ts's
    # dev-server proxy — the web app calls relative /api/... paths and relies
    # on this being same-origin (no CORS registered on the api side; the
    # refresh token cookie is scoped to /api/auth). `api` resolves via
    # Docker Compose's internal DNS (see infra/compose.yaml).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
