<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@pkg/gantt — 10k-task benchmark</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="hud">
      <div class="brand">@pkg/gantt · §8 prototype</div>
      <div class="stats">
        <span>tasks <strong id="task-count">—</strong></span>
        <span>deps <strong id="dep-count">—</strong></span>
        <span>scroll <strong id="scroll">0, 0</strong></span>
        <span class="fps">FPS <strong id="fps">—</strong></span>
        <span>hover <strong id="hover">—</strong></span>
      </div>
      <div class="hint">Scroll / trackpad to pan · target ≥50 FPS @ 10k (S2)</div>
    </header>
    <main id="gantt-root" aria-label="Gantt benchmark canvas"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
